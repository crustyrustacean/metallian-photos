[package]
name = "metallian-photos"
version = "0.10.2"
edition = "2024"
authors = ["Jeffery D. Mitchell", "<crusty.rustacean@gmail.com>"]
description = "A photo management API using Actix Web, SQLite, and Cloudflare R2"
readme = "README.md"
repository = "https://github.com/crustyrustacean/metallian-photos.git"
license = "MIT"
publish = false

[[bin]]
name = "metallian-photos"
path = "src/bin/main.rs"

[dependencies]
actix-cors = "0.7"
actix-identity = "0.9"
actix-session = { version = "0.11", features = ["cookie-session"] }
actix-files = "0.6"
actix-multipart = { version = "0.8", features = ["tempfile"] }
actix-web = "4"
async-trait = "0.1"
anyhow = "1"
bytes = "1"
datastar = { git = "https://github.com/crustyrustacean/datastar-rust.git", branch = "feat/actix-adapter", features = ["actix"] }
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
heic = "0.1"
image = "0.25"
kamadak-exif = "0.6"
log = "0.4"
opendal = { version = "0.58", features = ["services-s3", "services-fs"] }
reqwest = { version = "0.13", features = [ "json" ] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-aux = "4.7.0"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "uuid",
    "chrono",
    "migrate",
] }
tera = { version = "2.1", features = ["fast", "glob_fs"] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-log = "0.2"
tracing-bunyan-formatter = "0.3"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["form", "multipart", "cookies"] }

[profile.dev.package."*"]
# Dependencies get full optimization so compute-heavy crates (heic, image)
# run at near-release speed during development. Our own crates stay at
# opt-level 0 for fast recompiles and step-debugging.
opt-level = 3