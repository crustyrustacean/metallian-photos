# fly.toml — Metallian Photos deployment config
#
# Deploy with: fly deploy
# First-time setup: fly launch (creates the app) then fly volumes create photos_data

app = "metallian-photos"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[http_service.concurrency]
  type = "requests"
  hard_limit = 250
  soft_limit = 200

# Persistent volume for SQLite database
[[mounts]]
  source = "photos_data"
  destination = "/data"

[vm]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
